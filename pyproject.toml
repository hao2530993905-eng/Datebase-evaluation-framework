[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dbeval"
version = "0.1.0"
description = "Auditable, modular database evaluation framework"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "Database Evaluation Framework contributors"}]
dependencies = []

[project.scripts]
dbeval = "dbeval.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
